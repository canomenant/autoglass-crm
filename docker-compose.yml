services:
  postgres:
    image: postgres:16
    container_name: autoglass-crm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: autoglass_crm
      POSTGRES_USER: autoglass
      POSTGRES_PASSWORD: autoglass_dev_password
    # Enlazado a loopback: "5432:5432" a secas expone Postgres a toda la red local, y la
    # contraseña de abajo es de desarrollo. Sólo alcanzable desde esta máquina.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - autoglass_pg_data:/var/lib/postgresql/data

volumes:
  autoglass_pg_data:
